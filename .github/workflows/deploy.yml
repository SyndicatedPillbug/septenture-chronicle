name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify shared prose rendering and draft recovery
        run: npm ci --prefix services/nova-writing/editor && npm test --prefix services/nova-writing/editor

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Verify character identity and story filters
        run: node --test services/nova-reader/tests/*.test.mjs

      - name: Verify Table interaction guards and shared theme
        run: node --test services/campaign-theme/theme.test.mjs services/campaign-theme/tests/escape-overlay.mjs services/campaign-theme/tests/scene-interactions.mjs

      - name: Verify post-session content consistency
        run: npm run test:session-audit && npm run audit:session

      - name: Build site
        run: npx quartz build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
