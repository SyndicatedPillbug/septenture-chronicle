<!doctype html><meta charset="utf-8"><title>Septenture theme preference</title><script>
(()=>{const key='septenture-theme-v1',allowed=new Set(['https://syndicatedpillbug.github.io','https://septenture.helioho.st','https://septenture-play.roundtablewriters.org',...(location.hostname==='127.0.0.1'?['http://127.0.0.1:8795','http://127.0.0.1:8796','http://127.0.0.1:8082','http://127.0.0.1:8797','http://127.0.0.1:8808','http://127.0.0.1:8081','http://127.0.0.1:8081']:[])]);let peer=null;const valid=r=>r&&['light','dark','system'].includes(r.mode)&&Number.isFinite(r.updated)&&r.updated>=0&&r.updated<=Date.now()+60000;const read=()=>{try{const r=JSON.parse(localStorage.getItem(key));if(valid(r))return r}catch{}return {mode:'system',updated:0}};const reply=()=>{if(peer)peer.source.postMessage({type:'septenture-theme-state',record:read()},peer.origin)};addEventListener('message',event=>{if(event.source!==parent||!allowed.has(event.origin))return;if(event.data?.type==='septenture-theme-read'){peer={source:event.source,origin:event.origin};reply()}if(event.data?.type==='septenture-theme-set'&&valid(event.data.record)){peer={source:event.source,origin:event.origin};if(event.data.record.updated>=read().updated)try{localStorage.setItem(key,JSON.stringify(event.data.record))}catch{}reply()}});addEventListener('storage',e=>{if(e.key===key)reply()})})();
</script>
